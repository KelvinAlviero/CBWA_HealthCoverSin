<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HealthCover wellness website">
    <title>HC_QuoteSystem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React from "https://esm.sh/react@19";
        import { createRoot } from "https://esm.sh/react-dom/client";

        const TopBar = () => React.createElement(
            "header",
            { className: "top-bar" },
            React.createElement(
                "a",
                { className: "brand", href: "#" },
                React.createElement("span", null, "QuoteSystem")
            )
        );

        const QuoteSystem = () => {
            const [quotes, setQuotes] = React.useState([
                { id: 1, name: "Rayan" },
                { id: 2, name: "Brandiddy" },
                { id: 3, name: "Jose Gose" }
            ]);
            const [name, setName] = React.useState("");
            const [isFormOpen, setIsFormOpen] = React.useState(false);

            const addQuote = (event) => {
                event.preventDefault();
                const trimmedName = name.trim();

                if (!trimmedName) return;

                setQuotes((currentQuotes) => [
                    ...currentQuotes,
                    { id: Date.now(), name: trimmedName }
                ]);
                setName("");
                setIsFormOpen(false);
            };

            return React.createElement(
                "section",
                { className: "quotes-section", id: "quotes" },
                React.createElement(
                    "div",
                    { className: "section-heading" },
                    React.createElement(
                        "div",
                        null,
                        React.createElement("h2", null, "Customer quotes")
                    ),
                    React.createElement(
                        "button",
                        {
                            className: "add-quote-button",
                            type: "button",
                            onClick: () => setIsFormOpen((open) => !open)
                        },
                        "Add quote"
                    )
                ),
                isFormOpen && React.createElement(
                    "form",
                    { className: "quote-form", onSubmit: addQuote },
                    React.createElement(
                        "label",
                        { htmlFor: "quote-name" },
                        "Name"
                    ),
                    React.createElement("input", {
                        id: "quote-name",
                        type: "text",
                        value: name,
                        onChange: (event) => setName(event.target.value),
                        placeholder: "Enter a name",
                        autoFocus: true
                    }),
                    React.createElement(
                        "button",
                        { className: "save-button", type: "submit" },
                        "Save quote"
                    )
                ),
                React.createElement(
                    "div",
                    { className: "table-wrap" },
                    React.createElement(
                        "table",
                        { className: "quote-table" },
                        React.createElement(
                            "thead",
                            null,
                            React.createElement(
                                "tr",
                                null,
                                React.createElement("th", null, "Name")
                            )
                        ),
                        React.createElement(
                            "tbody",
                            null,
                            quotes.map((quote) => React.createElement(
                                "tr",
                                { key: quote.id },
                                React.createElement("td", null, quote.name)
                            ))
                        )
                    )
                )
            );
        };

        const App = () => React.createElement(
            React.Fragment,
            null,
            React.createElement(TopBar),
            React.createElement(
                "main",
                { className: "page-content" },
                React.createElement(QuoteSystem)
            )
        );

        createRoot(document.getElementById("root")).render(
            React.createElement(App)
        );
    </script>
</body>
</html>
